#	Configuration basique pour Unbound sur une machine seule sous Windows
#	Il faut adapter les chemins pour du Linux/MaOS/BSD


#
#	Résolution récursive publique avec transmission des zones locales
#
server:
	#	localhost uniquement
	interface:					127.0.0.1
	interface:					::1
	port:						53

	#	Le service ne peut être appelée que par la machine
	access-control:				127.0.0.0/8 allow
	access-control:				::1 allow
	do-ip4:						yes
	do-ip6:						yes
	do-udp:						yes
	do-tcp:						yes

	#	Les racines (à télécharger ici : https://www.internic.net/domain/named.root) et à renommer en "root.hints"
	root-hints:					"C:\Program Files\Unbound\root.hints"

	#	La validation DNSSEC (déjà fournie dans Unbound)
	auto-trust-anchor-file:		"C:\Program Files\Unbound\root.key"
	val-permissive-mode:		no

	#	Quelques paramètres
	qname-minimisation:			yes
	hide-identity:				yes
	hide-version:				yes
	harden-glue:				yes

	#	Petite configuration du cache adapté à une machine seule
	msg-cache-size:				32m
	rrset-cache-size:			64m
	cache-min-ttl:				0

	#	La journalisation
	verbosity:					1
	log-queries:				no

	#	Le plus important, les IP privées !
	private-address:			10.0.0.0/8
	private-address:			172.16.0.0/12
	private-address:			192.168.0.0/16
	private-address:			169.254.0.0/16
	private-address:			fd00::/8
	private-address:			fe80::/10

	#	On autorise les adresses privées pour le domaine local suivant
    private-domain:				"home.arpa."

	#	Désactivation des réponses locales par défaut pour les zones prises en charge par votre box internet
	local-zone:					"home.arpa." nodefault
	local-zone:					"1.168.192.in-addr.arpa." nodefault

	# 	Les zones privées n'ont pas besoin de DNSSEC
    domain-insecure:			"home.arpa."
	domain-insecure:			"1.168.192.in-addr.arpa."
	
#
#	La résolution des noms du réseau local se fait via la box internet
#
forward-zone:
    name:						"home.arpa."
    forward-addr:				192.168.1.1
    forward-first:				no

#
#	Résolution DNS inverse du réseau 192.168.1.0/24
#
forward-zone:
    name:						"45.138.10.in-addr.arpa."
    forward-addr:				192.168.1.0
    forward-first:				no

